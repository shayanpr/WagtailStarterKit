{% load wagtailcore_tags %}

<section class="py-16 transition-colors duration-300">
    <div class="container mx-auto px-6 lg:px-10">
        
        {% if self.is_featured %}
            <div class="flex justify-center mb-10">
                <span class="bg-blue-600 text-white text-[10px] font-bold uppercase tracking-[0.2em] px-4 py-1.5 rounded-full reveal">
                    Project Deep Dive
                </span>
            </div>
        {% endif %}

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            {# The Problem #}
            <div class="flex flex-col h-full bg-white dark:bg-gray-900 p-8 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 reveal">
                <h3 class="text-sm font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-red-400"></span> The Problem
                </h3>
                <div class="prose prose-sm text-gray-600 dark:text-gray-400 leading-relaxed dark:prose-invert">
                    {{ self.problem|richtext }}
                </div>
            </div>

            {# The Solution #}
            <div class="flex flex-col h-full bg-white dark:bg-gray-900 p-8 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 reveal">
                <h3 class="text-sm font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-blue-400"></span> Our Solution
                </h3>
                <div class="prose prose-sm text-gray-600 dark:text-gray-400 leading-relaxed dark:prose-invert">
                    {{ self.solution|richtext }}
                </div>
            </div>

            {# The Results #}
            <div class="flex flex-col h-full bg-blue-600 dark:bg-blue-900 p-8 rounded-2xl shadow-lg reveal">
                <h3 class="text-sm font-bold text-blue-200 dark:text-blue-300 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-white dark:bg-blue-200"></span> The Results
                </h3>
                <div class="prose prose-sm prose-invert text-white/90 dark:text-blue-50 leading-relaxed">
                    {{ self.results|richtext }}
                </div>
            </div>

        </div>
    </div>
</section>
