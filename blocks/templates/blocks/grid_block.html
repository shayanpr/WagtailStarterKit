{% load wagtailcore_tags %}

<section class="py-24 bg-transparent transition-colors duration-300">
    <div class="container mx-auto px-6">
        {% if value.grid_title %}
            <h2 class="text-4xl font-bold mb-12 tracking-tight text-center text-slate-900 dark:text-white">{{ value.grid_title }}</h2>
        {% endif %}

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-{{ value.columns|length }} gap-8">
            {% for column in value.columns %}
                <div class="bg-white dark:bg-slate-900/50 p-10 rounded-3xl shadow-sm dark:shadow-none border border-slate-200/50 dark:border-slate-800/50 hover:shadow-md transition-all">
                    {# Each column is a StreamBlock, so we loop through and render its sub-blocks #}
                    {% for block in column %}
                        <div class="mb-4 last:mb-0 reveal">
                            {% include_block block %}
                        </div>
                    {% endfor %}
                </div>
            {% endfor %}
        </div>
    </div>
</section>
