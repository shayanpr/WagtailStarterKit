{% load wagtailimages_tags %}

<div class="h-full bg-white dark:bg-slate-900 p-10 rounded-3xl border border-slate-200/50 dark:border-slate-800 shadow-sm dark:shadow-none hover:shadow-xl dark:hover:border-blue-900 transition-all duration-500 transform hover:-translate-y-2 text-center flex flex-col items-center">

    {% if self.icon %}
        <div class="mb-8 w-24 h-24 rounded-3xl bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center reveal">
            {% image self.icon fill-120x120 format-webp class="h-14 w-14 object-contain" %}
        </div>
    {% endif %}

    <h3 class="text-2xl font-bold mb-4 text-slate-900 dark:text-white reveal">
        {{ self.title }}
    </h3>

    <div class="text-slate-600 dark:text-slate-400 leading-relaxed text-base reveal">
        {{ self.description }}
    </div>
</div>
